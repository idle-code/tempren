name: publish-on-pypi
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  publish-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build and publish to PyPi
        uses: JRubics/poetry-publish@v1.17
        with:
          pypi_token: ${{ secrets.PYPI_TOKEN }}
      - name: Get release version
        id: vars
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Wait for package to be published
        uses: martolini/wait-for-pypi-action@main
        with:
          package_name: tempren
          package_version: ${{ env.RELEASE_VERSION }}
          delay_between_requests: 5
          timeout: 60

      - name: Write snap version
        run: echo "${RELEASE_VERSION#v}" > packaging/snap/version.txt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Build snap package
        uses: canonical/action-build@v1
        id: build_snap
        with:
          path: packaging/snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap-artifact
          path: ${{ steps.build_snap.outputs.snap }}
      - name: Publish snap package to the snapcraft.io store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_LOGIN }}
        with:
          snap: ${{ steps.build_snap.outputs.snap }}
          release: edge

      - name: Build AppImage
        id: build_appimage
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          bash packaging/appimage/build-appimage.sh "${VERSION}"
          echo "appimage=$(ls tempren-*.AppImage | head -1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-artifact
          path: ${{ steps.build_appimage.outputs.appimage }}

      - name: Make a GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.build_snap.outputs.snap }}
            ${{ steps.build_appimage.outputs.appimage }}
          generate_release_notes: true
