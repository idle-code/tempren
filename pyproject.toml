[tool.poetry]
name = "tempren"
version = "1.4.0"
description = "Template-based renaming utility"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = ["Paweł Żukowski <p.z.idlecode@gmail.com>"]
homepage = "https://github.com/idle-code/tempren"
keywords = ["batch-renaming", "cli", "filename"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities"
]

[tool.poetry.dependencies]
python = "^3.11"
antlr4-python3-runtime = "4.13.2"
Unidecode = "^1.3.6"
pathvalidate = "^3.1.0"
mutagen = "^1.46.0"
docstring-parser = "^0.18"
python-magic = "^0.4.27"
Pillow = "^13.0.0"
pymediainfo = {version = "^7.0.1", optional = true}
isodate = "^0.7.2"
gpxpy = "^1.6.2"
Pint = ">=0.21.0"
geopy = "^2.5.0"
fastkml = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1"
coverage = "^7.10.6"
pre-commit = "^4.7"
mypy = "^2.4.1"
pylint = "^4.0.9"
black = "^26.10.1"

[tool.poetry.extras]
video = ["pymediainfo"]

[tool.poetry.scripts]
tempren = "tempren.cli:throwing_main"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.pytest.ini_options]
addopts = "--cov-report=xml --cov-report=term-missing --cov=tempren"
testpaths = ["tests"]
markers = [
    "e2e: slower, end-to-end tests often running tempren as a separate process",
    "slow: slower tests that often use timeouts"
]

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
